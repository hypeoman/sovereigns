plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Dev copy of the State of War pack; set in ~/.gradle/gradle.properties (see docs/SETUP.md).
def instanceDirPath = providers.gradleProperty('sovereigns.instanceDir').orNull
if (!instanceDirPath) {
    throw new GradleException('sovereigns.instanceDir is not set in ~/.gradle/gradle.properties (see docs/SETUP.md)')
}
def instanceMods = file("${instanceDirPath}/mods")
if (!instanceMods.isDirectory()) {
    throw new GradleException("No mods/ folder in sovereigns.instanceDir: ${instanceDirPath}")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Mods of the pack we compile against: the exact jars from the instance, never downloaded versions.
def compileAgainst = ['minecolonies-1', 'structurize-', 'blockui-', 'domum-ornamentum-',
                      'WarNTaxes-', 'colonies_at_war-', 'warnnobility-']

dependencies {
    compileOnly fileTree(instanceMods) { compileAgainst.each { include "${it}*.jar" } }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---- State of War instance tasks ----

def clientOnlyPrefixes = file('client-only-mods.txt').readLines()
        .collect { it.trim().toLowerCase() }.findAll { it && !it.startsWith('#') }

tasks.register('syncInstanceMods', Sync) {
    group = 'sovereigns'
    description = 'Copies server-compatible mods of the instance into run/mods for runServer.'
    from(instanceMods) {
        include '*.jar'
        exclude 'sovereigns-*.jar'
        // Jar names mix cases (Sodium vs sodium): compare lowercase prefixes.
        exclude { e -> clientOnlyPrefixes.any { e.name.toLowerCase().startsWith(it) } }
    }
    into 'run/mods'
    doLast {
        // Dev-only local server needs the EULA flag to start.
        file('run/eula.txt').text = 'eula=true\n'
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'syncInstanceMods'
    // Lets console commands reach the server (and scripted smoke tests pipe "realmdebug ping"/"stop").
    standardInput = System.in
}

tasks.register('deployToInstance') {
    group = 'sovereigns'
    description = 'Builds the mod and puts the jar into the instance mods/, removing older sovereigns jars.'
    dependsOn 'build'
    doLast {
        instanceMods.listFiles().findAll { it.name ==~ /sovereigns-.*\.jar/ }.each { it.delete() }
        copy {
            from tasks.jar.archiveFile
            into instanceMods
        }
        println "Deployed ${tasks.jar.archiveFile.get().asFile.name} -> ${instanceMods}"
    }
}

tasks.register('inventoryInstance') {
    group = 'sovereigns'
    description = 'Lists mods of the instance with versions into docs/PACK.md (keeps the text above the marker).'
    doLast {
        def marker = '<!-- generated by ./gradlew inventoryInstance, do not edit below -->'
        def rows = []
        instanceMods.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name.toLowerCase() }.each { jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def toml = zip.getEntry('META-INF/neoforge.mods.toml')
                def text = toml ? zip.getInputStream(toml).getText('UTF-8') : ''
                def mf = zip.getEntry('META-INF/MANIFEST.MF')
                def implVersion = ''
                if (mf) {
                    def m = zip.getInputStream(mf).getText('UTF-8') =~ /Implementation-Version:\s*(\S+)/
                    if (m.find()) implVersion = m.group(1)
                }
                // Only [[mods]] sections; [[dependencies.*]] also contain modId lines.
                def mods = text.split(/\[\[/).findAll { it.startsWith('mods]]') }.collect { section ->
                    def field = { String key -> def m = section =~ /(?m)^\s*${key}\s*=\s*"([^"]*)"/; m.find() ? m.group(1) : '' }
                    def v = field('version')
                    [id: field('modId'), name: field('displayName'), version: v.contains('${') ? implVersion : v]
                }
                if (mods.isEmpty()) mods = [[id: '?', name: '', version: implVersion]]
                mods.each { rows << "| ${jar.name} | ${it.id} | ${it.name} | ${it.version} |" }
            }
        }
        def pack = file('docs/PACK.md')
        def head = pack.exists() && pack.text.contains(marker) ? pack.text.substring(0, pack.text.indexOf(marker)) : '# Моды сборки State of War\n\n'
        pack.text = head + marker + '\n\n' + "Источник: `${instanceMods}`, модов-файлов: ${instanceMods.listFiles().count { it.name.endsWith('.jar') }}.\n\n" +
                '| Файл | modId | Название | Версия |\n| --- | --- | --- | --- |\n' + rows.join('\n') + '\n'
        println "Wrote ${rows.size()} rows to ${pack}"
    }
}
